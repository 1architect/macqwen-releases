[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macqwen"
version = "0.5.1"
description = "Apple Silicon runtime for local language model inference"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "1architect" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "mlx==0.32.3",
  "mlx-lm==0.32.0",
  "mlx-vlm==0.7.4",
  "transformers==5.18.0",
  "numpy==2.5.3",
  "requests==2.34.2",
  "huggingface-hub==2.1.1",
]

[project.scripts]
macqwen = "macqwen.cli:main"

[project.urls]
Homepage = "https://github.com/1architect/macqwen-releases"
Repository = "https://github.com/1architect/macqwen-releases"
Issues = "https://github.com/1architect/macqwen-releases/issues"

[tool.setuptools.packages.find]
include = ["macqwen*", "models*"]
