[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macqwen"
version = "0.4.0"
description = "Low-memory Apple Silicon runtime for local Qwen inference"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "1architect" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
flashnext = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "mlx-vlm==0.6.17",
  "transformers==5.16.1",
  "numpy==2.5.2",
  "requests==2.34.2",
  "huggingface-hub==1.29.0",
]

[project.scripts]
macqwen = "macqwen.cli:main"

[project.urls]
Homepage = "https://github.com/1architect/macqwen-releases"
Repository = "https://github.com/1architect/macqwen-releases"
Issues = "https://github.com/1architect/macqwen-releases/issues"

[tool.setuptools.packages.find]
include = ["macqwen*", "models*"]
