name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install '.[flashnext]'
      - name: Test shared runtime
        run: python -m unittest discover -s macqwen -p 'test_*.py' -q
      - name: Test Flash-Next runtime
        run: python -m unittest discover -s models/flashnext -p 'test_*.py' -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
